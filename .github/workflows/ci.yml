# CI 门禁（REPO-GOVERNANCE.md §8）
#
# 设计原则：韧性优先，不阻塞迭代。
# - 只校验「ingest 闭环能跑通 + 生成物可由真源复现」，不做「schema 版本严格门禁」。
# - 理由：MVP 期 schema 还会调整；若用严格 schema 校验当门禁，每次调字段都会把自己挡在门外。
# - 因此它防的是「真源 recipes/ 与派生物 llms.txt / experiences.json 漂移」这类真实风险，
#   而不是「schema 变了」这种预期中的演进。
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Rebuild indices (must not crash)
        # ingest.py 自带 validate + roundtrip 闸门；rebuild 扫描 recipes/ 重建 llms.txt / experiences.json
        run: python api/ingest.py rebuild

      - name: Verify generated artifacts are reproducible
        # 提交里带的就是「发布快照」(§6)。若有人手改了 llms.txt/experiences.json 却没重跑 rebuild，
        # 这里会失败，提醒「先重跑 python api/ingest.py rebuild 再提交」。
        run: |
          if ! git diff --exit-code -- llms.txt api/experiences.json; then
            echo "::error::llms.txt / api/experiences.json 与 recipes/ 真源不一致，请重跑 'python api/ingest.py rebuild' 并提交结果"
            exit 1
          fi
        shell: bash

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Full test suite (must pass)
        # 曾经这里只单跑 search-baseline + mcp-smoke 两条命令，等于门禁只覆盖 9 个测试文件里的 2 个。
        # 后果很隐蔽：别人提 PR 把写侧（submit_recipe / promote_recipe）、隔离池、引用校验、
        # 投稿解析改坏了，CI 照样绿灯 —— 「CI 门禁」这句承诺就成了空话。
        # 现在跑 npm test（9 个文件 / 271 项断言），与本地开发完全同一套，不再有覆盖差集。
        #
        # 这几套测试各守一条线，失败时先看是哪条：
        #   search-baseline        检索质量基线（正例 6/6 ｜ 反例 3/3 ｜ 元配方不抢 Top1 ｜ 英文短词不穿透词边界）
        #   search-pagination      翻页与 limit/offset 边界
        #   search-quarantine      L3 隔离：C 级不进主检索、B 档可见、破例放行阈值
        #   mcp-smoke              真 spawn 子进程走 stdio JSON-RPC：握手 / 工具 / 参数校验 / 只读边界 / 数据源缺失不冒充空库
        #   agent-prompts          经验向导 prompts 自动上岗（C-1~C-6 硬约束）
        #   write-mcp              写权限开关（RECIPE_BOOK_WRITE）+ 写侧端到端
        #   verify-citations       引用校验（防编造）
        #   ingest / ingest-write  Issue 解析、脱敏、撞 id、晋升门槛、索引幂等
        run: npm test
        shell: bash
